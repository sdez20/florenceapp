<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Florence — Create your account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Figtree:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#FAF8F2;
    --white-soft:#F7F2EC;
    --blush:#EFEADC;
    --blush-deep:#97A06E;
    --clay:#B0A06F;
    --clay-soft:#C9BE9A;
    --olive:#6E7B4C;
    --olive-deep:#1F2A22;
    --ink:#1F2A22;
    --ink-soft:#7A7A6C;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Figtree',sans-serif;background:#E4E2D6;color:var(--ink);
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;
  }
  .phone{
    width:100%;max-width:390px;height:min(844px,92vh);
    border-radius:44px;overflow:hidden;position:relative;background:var(--white);
    box-shadow:0 40px 120px rgba(58,53,46,.30), 0 0 0 1px rgba(92,107,67,.18);
    display:flex;flex-direction:column;
  }
  .field{
    position:absolute;inset:0;z-index:0;
    background:#FAF8F2;
  }

  .content{
    position:relative;z-index:1;flex:1;display:flex;flex-direction:column;
    padding:64px 32px 32px;
  }
  .middle{flex:1;display:flex;flex-direction:column;justify-content:center;padding:18px 0}
  .back{font-size:22px;color:var(--ink-soft);font-weight:300;cursor:pointer;margin-bottom:30px;line-height:1}

  .eyebrow{
    font-size:11px;letter-spacing:.3em;text-transform:uppercase;
    color:var(--clay);font-weight:600;margin-bottom:14px;
  }
  h1{
    font-family:'Cormorant Garamond',serif;font-weight:500;font-size:38px;
    line-height:1.08;color:var(--olive-deep);margin-bottom:44px;
  }

  .form{display:flex;flex-direction:column;gap:20px}
  .fieldgroup label{
    display:block;font-size:12px;letter-spacing:.04em;color:var(--ink-soft);
    font-weight:500;margin-bottom:8px;padding-left:2px;
  }
  .fieldgroup input{
    width:100%;background:transparent;border:1.5px solid rgba(110,123,83,.22);
    border-radius:14px;padding:16px 18px;
    font-family:'Figtree',sans-serif;font-size:15px;color:var(--ink);
    transition:border-color .25s ease;
  }
  .fieldgroup input::placeholder{color:var(--ink-soft);opacity:.55}
  .fieldgroup input:focus{outline:none;border-color:var(--clay)}

  .create{
    width:100%;padding:18px;border:1.5px solid var(--olive);border-radius:18px;
    background:var(--olive-deep);color:var(--white);
    font-family:'Figtree',sans-serif;font-size:13px;font-weight:600;letter-spacing:.18em;
    text-transform:uppercase;cursor:pointer;transition:transform .3s ease, background .3s ease;
    margin-top:auto;
  }
  .create:hover{background:var(--olive);transform:translateY(-1px)}
  .create:focus-visible{outline:2px solid var(--clay);outline-offset:3px}

  .signin{text-align:center;font-size:13.5px;color:var(--ink-soft);font-weight:400;margin-top:20px}
  .signin a{color:var(--clay);font-weight:600;text-decoration:none}

  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
  <div class="phone">
    <div class="field"></div>
    <div class="content">
      <div class="back">&#8249;</div>

      <div class="middle">
      <div class="eyebrow">Florence</div>
      <h1>Let's make your space.</h1>

      <div class="form">
        <div class="fieldgroup">
          <label for="name">What may Florence call you?</label>
          <input id="name" type="text" placeholder="Your name">
        </div>
        <div class="fieldgroup">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com">
        </div>
        <div class="fieldgroup">
          <label for="pass">Password</label>
          <input id="pass" type="password" placeholder="Create a password">
        </div>
      </div>
      </div>

      <button class="create">Create my account</button>
      <div class="signin">Already with Florence? <a href="#">Sign in</a></div>
    </div>
  </div>
</body>
</html>
