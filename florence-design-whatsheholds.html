<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Florence — Welcome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Figtree:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#FAF8F2;
    --white-soft:#F7F2EC;
    --blush:#EFEADC;
    --blush-deep:#97A06E;
    --clay:#B0A06F;
    --clay-soft:#C9BE9A;
    --olive:#6E7B4C;
    --olive-deep:#1F2A22;
    --ink:#1F2A22;
    --ink-soft:#7A7A6C;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Figtree',sans-serif;background:#E4E2D6;color:var(--ink);
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;
  }
  .phone{
    width:100%;max-width:390px;height:min(844px,92vh);
    border-radius:44px;overflow:hidden;position:relative;background:var(--white);
    box-shadow:0 40px 120px rgba(58,53,46,.30), 0 0 0 1px rgba(92,107,67,.18);
    display:flex;flex-direction:column;
  }

  /* soft living field, very light */
  .field{
    position:absolute;inset:0;z-index:0;
    background:#FAF8F2;
  }
  .field::after{
    content:"";position:absolute;inset:0;
    background:transparent;
    animation:breathe 13s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.9;transform:scale(1.05)}}

  .content{
    position:relative;z-index:1;flex:1;display:flex;flex-direction:column;
    padding:0 38px 44px;
  }

  /* upper: the name, centered in generous space */
  .hero{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
  }
  .mark{
    width:54px;height:54px;border-radius:50%;
    border:1.5px solid var(--clay-soft);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:34px;
  }
  .mark span{
    font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;
    font-size:26px;color:var(--clay);line-height:1;
  }
  .name{
    font-family:'Cormorant Garamond',serif;font-weight:500;
    font-size:58px;line-height:1;color:var(--olive-deep);letter-spacing:.01em;
    margin-bottom:24px;
  }
  .tagline{
    font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;
    font-size:23px;line-height:1.4;color:var(--ink);max-width:20ch;
  }
  .tagline em{color:var(--clay);font-style:italic}

  /* lower: a few plain words + the invitation */
  .lower{display:flex;flex-direction:column;align-items:center;text-align:center}
  .lede{
    font-size:14.5px;line-height:1.7;color:var(--ink-soft);font-weight:300;
    max-width:30ch;margin-bottom:30px;
  }
  .begin{
    width:100%;padding:18px;border:1.5px solid var(--olive);border-radius:18px;
    background:var(--olive-deep);color:var(--white);
    font-family:'Figtree',sans-serif;font-size:13px;font-weight:600;letter-spacing:.18em;
    text-transform:uppercase;
    cursor:pointer;transition:transform .3s ease, background .3s ease;
  }
  .begin:hover{background:var(--olive);transform:translateY(-1px)}
  .begin:focus-visible{outline:2px solid var(--clay);outline-offset:3px}
  .signin{
    margin-top:18px;font-size:13.5px;color:var(--ink-soft);font-weight:400;
  }
  .signin a{color:var(--clay);font-weight:600;text-decoration:none}

  @media (prefers-reduced-motion: reduce){.field::after{animation:none}*{transition:none!important}}
</style>
</head>
<body>
  <div class="phone">
    <div class="field"></div>
    <div class="content">

      <div class="hero">
        <div class="name">Florence</div>
      </div>

      <div class="lower">
        <button class="begin">BEGIN</button>
        <div class="signin">Already with Florence? <a href="#">Sign in</a></div>
      </div>

    </div>
  </div>
</body>
</html>
