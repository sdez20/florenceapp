<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Florence — How to use</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Figtree:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#FAF8F2;--white-soft:#F7F2EC;--blush:#EFEADC;--blush-deep:#97A06E;
    --clay:#B0A06F;--clay-soft:#C9BE9A;--olive:#6E7B4C;--olive-deep:#1F2A22;
    --ink:#1F2A22;--ink-soft:#7A7A6C;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Figtree',sans-serif;background:#E4E2D6;color:var(--ink);
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;
  }
  .phone{
    width:100%;max-width:390px;height:min(844px,92vh);
    border-radius:44px;overflow:hidden;position:relative;background:var(--white);
    box-shadow:0 40px 120px rgba(58,53,46,.30), 0 0 0 1px rgba(92,107,67,.18);
    display:flex;flex-direction:column;
  }
  .field{
    position:absolute;inset:0;z-index:0;
    background:#FAF8F2;
  }
  .content{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;padding:56px 30px 28px;overflow-y:auto}
  .middle{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px 0}

  .step{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--clay);font-weight:600;margin-bottom:14px}
  h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:32px;line-height:1.1;color:var(--olive-deep);margin-bottom:6px}
  .lede{font-size:13.5px;line-height:1.6;color:var(--ink-soft);font-weight:300;margin-bottom:28px;max-width:32ch}

  .rows{display:flex;flex-direction:column;gap:16px;margin-bottom:22px}
  .row{display:flex;gap:14px;align-items:flex-start}
  .ic{
    width:38px;height:38px;border-radius:50%;flex-shrink:0;
    border:1.5px solid var(--clay-soft);display:flex;align-items:center;justify-content:center;
    font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;color:var(--clay);
  }
  .rtext .rt{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;color:var(--ink);line-height:1.2}
  .rtext .rd{font-size:13px;line-height:1.55;color:var(--ink-soft);font-weight:300;margin-top:3px}

  /* the highlighted "you can change anything, anytime" card */
  .card{
    background:var(--blush);border-radius:20px;padding:22px;margin-bottom:24px;
    position:relative;overflow:hidden;
  }
  .card::before{content:"";position:absolute;inset:0;background:transparent, transparent 60%)}
  .card .ct{position:relative;font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:600;color:var(--olive-deep);margin-bottom:8px;line-height:1.2}
  .card .cd{position:relative;font-size:13px;line-height:1.6;color:var(--ink);font-weight:300}
  .chips{position:relative;display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
  .chip{
    font-family:'Figtree',sans-serif;font-size:11.5px;font-weight:500;color:var(--clay);
    border:1px solid var(--clay-soft);border-radius:20px;padding:6px 12px;background:rgba(252,250,247,.6);
  }

  .why{margin-bottom:24px}
  .why .wt{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;color:var(--olive-deep);margin-bottom:7px}
  .why p{font-size:13px;line-height:1.62;color:var(--ink-soft);font-weight:300}
  .why p strong{color:var(--clay);font-weight:600}

  .enter{
    width:100%;padding:18px;border:1.5px solid var(--olive);border-radius:18px;
    background:var(--olive-deep);color:var(--white);
    font-family:'Figtree',sans-serif;font-size:12.5px;font-weight:600;letter-spacing:.18em;
    text-transform:uppercase;cursor:pointer;margin-top:0;flex-shrink:0;transition:transform .3s ease, background .3s ease;
  }
  .enter:hover{background:var(--olive);transform:translateY(-1px)}
</style>
</head>
<body>
  <div class="phone">
    <div class="field"></div>
    <div class="content">
      <div class="middle">
      <div class="step">A few words first</div>
      <h1>How Florence works.</h1>

      <div class="rows">
        <div class="row">
          <div class="ic">i</div>
          <div class="rtext">
            <div class="rt">Start with a check-in</div>
            <div class="rd">Tell her how you're feeling today.</div>
          </div>
        </div>
        <div class="row">
          <div class="ic">ii</div>
          <div class="rtext">
            <div class="rt">Then talk</div>
            <div class="rd">Say what's on your mind and how you're feeling.</div>
          </div>
        </div>
        <div class="row">
          <div class="ic">iii</div>
          <div class="rtext">
            <div class="rt">Reflect</div>
            <div class="rd">View your chats, days, weeks, and months when you want to see how far you've come.</div>
          </div>
        </div>
      </div>
      </div>

      <button class="enter">I'm ready</button>
    </div>
  </div>
</body>
</html>
